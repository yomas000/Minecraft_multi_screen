[package]
name = "mc-splitscreen"
version = "0.1.0"
edition = "2021"
description = "Local splitscreen Minecraft Java with Prism Launcher: setup, controller isolation and launching"
license = "MIT"

[dependencies]
# Pure-Rust only: HTTP goes through the system curl (Windows 10+ and Linux
# ship it), so there's no TLS stack or C toolchain to build or package
anyhow = "1"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
md5 = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
